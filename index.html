<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Representações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#14181c;
    --surface:#1b2027;
    --surface-2:#20262e;
    --border:#2c333c;
    --text:#e9e6e0;
    --text-dim:#8b929b;
    --accent:#c08a45;
    --accent-dim:#8a642f;
    --ok:#5aa476;
    --ok-bg:#1c2620;
    --warn:#c9973f;
    --warn-bg:#26221a;
    --bad:#c06452;
    --bad-bg:#271e1c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:1000px;margin:0 auto;padding:24px 20px 60px;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:20px;margin-bottom:24px;
    border-bottom:1px solid var(--border);
  }
  header.top .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:22px;letter-spacing:.2px;
  }
  header.top .brand span{color:var(--accent);}
  header.top .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:1.5px;
  }

  nav.tabs{
    display:flex;gap:2px;margin-bottom:28px;flex-wrap:wrap;
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:4px;
  }
  nav.tabs button{
    flex:1;min-width:90px;padding:10px 8px;background:transparent;border:none;
    color:var(--text-dim);font-family:'Inter',sans-serif;font-weight:600;
    font-size:13px;border-radius:7px;cursor:pointer;transition:.15s;
  }
  nav.tabs button.active{background:var(--accent);color:#1a1408;}
  nav.tabs button:not(.active):hover{background:var(--surface-2);color:var(--text);}

  .subtabs{display:flex;gap:8px;margin-bottom:18px;}
  .subtabs button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .subtabs button.active{border-color:var(--accent);color:var(--accent);background:var(--surface-2);}

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:18px 18px;margin-bottom:14px;
    position:relative;
  }
  .card::before{
    content:"";position:absolute;top:10px;left:10px;width:10px;height:10px;
    border-top:2px solid var(--accent-dim);border-left:2px solid var(--accent-dim);
    opacity:.6;
  }
  .card::after{
    content:"";position:absolute;bottom:10px;right:10px;width:10px;height:10px;
    border-bottom:2px solid var(--accent-dim);border-right:2px solid var(--accent-dim);
    opacity:.6;
  }
  .card-head{
    display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;user-select:none;
  }
  .card-head h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;}
  .card-head .ref{font-size:11px;color:var(--text-dim);}
  .chevron{transition:.2s;color:var(--text-dim);}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{display:none;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);}
  .card.open .card-body{display:block;}

  .subsection{margin-bottom:18px;}
  .subsection h4{
    font-size:11px;text-transform:uppercase;letter-spacing:1px;
    color:var(--text-dim);margin:0 0 10px;font-weight:600;
  }
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:13.5px;
  }
  .list-item a{color:var(--accent);text-decoration:none;}
  .list-item a:hover{text-decoration:underline;}
  .list-item .del{color:var(--text-dim);cursor:pointer;background:none;border:none;font-size:16px;padding:0 4px;}
  .list-item .del:hover{color:var(--bad);}
  .msg-item{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;margin-bottom:6px;font-size:13.5px;position:relative;
  }
  .msg-item .meta{font-size:10.5px;color:var(--text-dim);margin-top:6px;}

  .inline-form{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  input,select,textarea{
    background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:9px 11px;border-radius:7px;font-family:'Inter',sans-serif;font-size:13.5px;
    outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent-dim);}
  textarea{resize:vertical;min-height:60px;width:100%;}
  input.flex,select.flex{flex:1;min-width:120px;}
  button.btn{
    background:var(--accent);color:#1a1408;border:none;padding:9px 16px;
    border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  button.btn:hover{background:#d29a52;}
  button.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  button.btn.ghost:hover{border-color:var(--accent-dim);}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}
  button.btn.small{padding:6px 12px;font-size:12px;}

  .badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:3px 9px;
    border-radius:20px;text-transform:uppercase;letter-spacing:.5px;font-weight:500;
  }
  .badge.confirmado{background:var(--ok-bg);color:var(--ok);}
  .badge.aguardando{background:var(--warn-bg);color:var(--warn);}
  .badge.nao_fechado{background:var(--bad-bg);color:var(--bad);}

  .orc-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    flex-wrap:wrap;
  }
  .orc-info{flex:1;min-width:180px;}
  .orc-info .tit{font-weight:600;font-size:14px;}
  .orc-info .sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .status-btns{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .status-btns button{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 8px;
    border-radius:6px;border:1px solid var(--border);background:transparent;
    color:var(--text-dim);cursor:pointer;text-transform:uppercase;
  }
  .status-btns button.active.confirmado{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);}
  .status-btns button.active.aguardando{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);}
  .status-btns button.active.nao_fechado{background:var(--bad-bg);color:var(--bad);border-color:var(--bad);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  @media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr;}}

  .contato-card{display:flex;justify-content:space-between;align-items:flex-start;}
  .contato-info .nome{font-weight:600;font-size:14.5px;}
  .contato-info .empresa{font-size:12.5px;color:var(--accent);margin-top:1px;}
  .contato-info .details{font-size:12px;color:var(--text-dim);margin-top:6px;font-family:'IBM Plex Mono',monospace;}

  .empty{
    text-align:center;color:var(--text-dim);font-size:13px;padding:24px 10px;
    border:1px dashed var(--border);border-radius:10px;
  }

  .steps{display:flex;flex-direction:column;gap:16px;}
  .step{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .step .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--accent);color:#1a1408;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;margin-right:8px;
  }
  .step h4{display:inline;font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;}
  .step-body{margin-top:12px;}
  .item-pick{
    display:flex;flex-wrap:wrap;gap:8px;
  }
  .item-pick .chip{
    padding:8px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:12.5px;cursor:pointer;background:var(--surface-2);
  }
  .item-pick .chip.sel{border-color:var(--accent);background:var(--accent-dim);color:#fff;}
  .preview{
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:14px;white-space:pre-wrap;font-size:13px;line-height:1.6;margin-top:10px;
  }
  .send-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .send-actions a{text-decoration:none;}

  .loading{text-align:center;color:var(--text-dim);padding:40px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  .err-banner{
    background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);
    padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;
  }

  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-box{
    width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:32px 28px;position:relative;
  }
  .login-box::before{
    content:"";position:absolute;top:12px;left:12px;width:12px;height:12px;
    border-top:2px solid var(--accent-dim);border-left:2px solid var(--accent-dim);
  }
  .login-box::after{
    content:"";position:absolute;bottom:12px;right:12px;width:12px;height:12px;
    border-bottom:2px solid var(--accent-dim);border-right:2px solid var(--accent-dim);
  }
  .login-box .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin-bottom:4px;}
  .login-box .brand span{color:var(--accent);}
  .login-box .sub{font-size:12px;color:var(--text-dim);margin-bottom:22px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;}
  .login-box input{width:100%;margin-bottom:10px;}
  .login-box button{width:100%;margin-top:6px;}
  .login-box .err{color:var(--bad);font-size:12.5px;margin-top:10px;}
  .login-box .hint{color:var(--text-dim);font-size:11.5px;margin-top:16px;line-height:1.5;}
  .topbar-user{display:flex;align-items:center;gap:10px;}
  .topbar-user .who{font-size:11.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .topbar-user button{background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:7px;font-size:11.5px;cursor:pointer;}
  .topbar-user button:hover{border-color:var(--bad);color:var(--bad);}

  details.import-box{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;margin-bottom:14px;
  }
  details.import-box summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--accent);}
  details.import-box .hint{font-size:12px;color:var(--text-dim);margin:10px 0;line-height:1.5;}

  .hist-item{
    display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-item .hdate{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);min-width:110px;}
  .hist-item .htag{
    font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);
    font-family:'IBM Plex Mono',monospace;min-width:80px;
  }

  .kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .kpi{
    flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;
  }
  .kpi .val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--accent);}
  .kpi .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .chart-wrap h4{margin:0 0 12px;font-family:'Space Grotesk',sans-serif;font-size:15px;}
  .fechados-list{margin-top:10px;}
  .fechados-list .li{
    display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;
    border-bottom:1px dashed var(--border);
  }

  @media print{
    body{background:#fff;color:#111;}
    nav.tabs, .subtabs, .inline-form, button, details.import-box, .send-actions{display:none !important;}
    .card, .chart-wrap, .kpi{background:#fff;border:1px solid #ccc;box-shadow:none;}
    .card::before,.card::after{display:none;}
    .hist-item .htag{color:#333;}
    canvas{display:none;}
  }
  ::selection{background:var(--accent-dim);color:#fff;}
</style>
</head>
<body>
<div id="root" class="app"><div class="loading">carregando…</div></div>

<script>
// ---------- Configuração do Supabase ----------
// Projeto: fernandocarvalholeite's Project (plano gratuito)
const SUPABASE_URL = 'https://cpkjphodruyxfouirhpd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_d0HEeWsaqOeZIQKGftlF-Q_B8BUOWWg';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Lista de fornecedores/indústrias agora vive 100% na tabela fc_fornecedores.
// Os 4 fornecedores originais (Matrizes Cardeal, Engefitas, Nopla Metais, FC Consultoria)
// foram migrados para lá via SQL — ver instruções enviadas separadamente.

let state = null;
let loadError = null;
let openCards = {};
let activeTab = 'fornecedores';
let relatorioSub = 'historico';
let sendState = { fornecedorId:null, tipos:[], itensPorTipo:{pasta:null,mensagem:null,orcamento:null}, contatoIds:[], canais:[], enviados:{}, modoFoto:'link' };
let histFiltro = { inicio:'', fim:'' };
let chartInstances = {};
let pastaTipo = {};
let session = null;
let loginError = null;
let loginInfo = null;
let authChecked = false;
let recoveryMode = false;

function esc(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function slugify(nome){
  return (nome||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'fornecedor';
}
function getFornecedoresList(){
  return Object.keys(state.fornecedores||{})
    .map(id=>({ id, nome: state.fornecedores[id].nome }))
    .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function isPdf(url){
  return (url||'').toLowerCase().split('?')[0].endsWith('.pdf');
}
function isVideo(url){
  const u = (url||'').toLowerCase().split('?')[0];
  return u.endsWith('.mp4') || u.endsWith('.mov') || u.endsWith('.webm') || u.endsWith('.avi') || u.endsWith('.mkv');
}
function fmtMoney(v){
  const n = parseFloat(v)||0;
  return n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

// ---------- Autenticação ----------
async function tryLogin(){
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const btn = document.getElementById('login-btn');
  loginError = null;
  if(!email || !senha){ loginError = 'Preencha e-mail e senha.'; renderLogin(); return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){
    loginError = 'E-mail ou senha inválidos.';
    renderLogin();
    return;
  }
  session = data.session;
  await refreshAndRender();
}

async function pedirRecuperacaoSenha(){
  const email = document.getElementById('login-email').value.trim();
  if(!email){ loginError = 'Digite seu e-mail no campo acima antes de clicar em "Esqueci minha senha".'; renderLogin(); return; }
  loginInfo = null; loginError = null;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if(error){ loginError = 'Não foi possível enviar o e-mail de recuperação: ' + error.message; }
  else { loginInfo = `E-mail de recuperação enviado para ${email}. Abra o link recebido para definir uma nova senha.`; }
  renderLogin();
}

async function doLogout(){
  await sb.auth.signOut();
  session = null;
  render();
}

function renderLogin(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div class="brand">FC <span>Representações</span></div>
        <div class="sub">acesso restrito · painel comercial</div>
        <input id="login-email" type="email" placeholder="E-mail" autocomplete="username" onkeydown="if(event.key==='Enter') tryLogin()">
        <input id="login-senha" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') tryLogin()">
        <button class="btn" id="login-btn" onclick="tryLogin()">Entrar</button>
        ${loginError ? `<div class="err">${esc(loginError)}</div>` : ''}
        ${loginInfo ? `<div class="err" style="color:var(--ok);">${esc(loginInfo)}</div>` : ''}
        <div class="hint" style="cursor:pointer;color:var(--accent);text-decoration:underline;" onclick="pedirRecuperacaoSenha()">Esqueci minha senha</div>
        <div class="hint">Acesso apenas para usuários cadastrados pela FC Consultoria.</div>
      </div>
    </div>
  `;
}

function renderRecuperarSenha(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div class="brand">FC <span>Representações</span></div>
        <div class="sub">definir nova senha</div>
        <input id="nova-senha-1" type="password" placeholder="Nova senha" autocomplete="new-password">
        <input id="nova-senha-2" type="password" placeholder="Confirme a nova senha" autocomplete="new-password">
        <button class="btn" id="nova-senha-btn" onclick="salvarNovaSenha()">Salvar nova senha</button>
        ${loginError ? `<div class="err">${esc(loginError)}</div>` : ''}
      </div>
    </div>
  `;
}

async function salvarNovaSenha(){
  const s1 = document.getElementById('nova-senha-1').value;
  const s2 = document.getElementById('nova-senha-2').value;
  loginError = null;
  if(!s1 || s1.length < 6){ loginError = 'A senha precisa ter pelo menos 6 caracteres.'; renderRecuperarSenha(); return; }
  if(s1 !== s2){ loginError = 'As senhas digitadas não são iguais.'; renderRecuperarSenha(); return; }
  const btn = document.getElementById('nova-senha-btn');
  btn.disabled = true; btn.textContent = 'Salvando...';
  const { error } = await sb.auth.updateUser({ password: s1 });
  if(error){
    loginError = 'Não foi possível salvar a senha: ' + error.message;
    renderRecuperarSenha();
    return;
  }
  recoveryMode = false;
  history.replaceState(null, '', window.location.pathname);
  await refreshAndRender();
}

// ---------- Camada de dados (Supabase) ----------
async function logHist(tipo, descricao, fornecedorId){
  try{
    await sb.from('fc_historico').insert({ tipo, descricao, fornecedor_id: fornecedorId||null });
  }catch(e){ console.error('Erro ao salvar histórico', e); }
}

async function refreshAndRender(){
  try{
    const [fRes, pRes, mRes, oRes, cRes, hRes, sRes] = await Promise.all([
      sb.from('fc_fornecedores').select('*'),
      sb.from('fc_pastas').select('*').order('created_at', {ascending:true}),
      sb.from('fc_mensagens').select('*').order('created_at', {ascending:true}),
      sb.from('fc_orcamentos').select('*').order('created_at', {ascending:true}),
      sb.from('fc_contatos').select('*').order('created_at', {ascending:true}),
      sb.from('fc_historico').select('*').order('created_at', {ascending:false}),
      sb.from('fc_settings').select('*').eq('id','default').maybeSingle(),
    ]);
    [fRes,pRes,mRes,oRes,cRes,hRes].forEach(r=>{ if(r.error) throw r.error; });

    const fornecedores = {};
    (fRes.data||[]).forEach(f=>{ fornecedores[f.id] = { nome:f.nome, pastas:[], mensagens:[] }; });
    (pRes.data||[]).forEach(p=>{ if(fornecedores[p.fornecedor_id]) fornecedores[p.fornecedor_id].pastas.push({id:p.id, nome:p.nome, link:p.link, tipo:p.tipo||'link'}); });
    (mRes.data||[]).forEach(m=>{ if(fornecedores[m.fornecedor_id]) fornecedores[m.fornecedor_id].mensagens.push({id:m.id, texto:m.texto, data:m.created_at}); });

    const orcamentos = (oRes.data||[]).map(o=>({ id:o.id, fornecedorId:o.fornecedor_id, titulo:o.titulo, numero:o.numero, valor:o.valor, link:o.link, status:o.status, data:o.created_at }));
    const contatos = (cRes.data||[]).map(c=>({ id:c.id, nome:c.nome, empresa:c.empresa, whatsapp:c.whatsapp, email:c.email }));
    const historico = (hRes.data||[]).map(h=>({ id:h.id, tipo:h.tipo, descricao:h.descricao, fornecedorId:h.fornecedor_id, data:h.created_at }));
    const meuWhatsapp = sRes && sRes.data ? sRes.data.meu_whatsapp : '';

    state = { fornecedores, orcamentos, contatos, historico, meuWhatsapp };
    loadError = null;
  }catch(e){
    console.error('Erro ao carregar dados do Supabase', e);
    loadError = e.message || 'Falha ao conectar com o banco de dados.';
    if(!state) state = { fornecedores:{}, orcamentos:[], contatos:[], historico:[] };
  }
  render();
}

async function addFornecedor(){
  const el = document.getElementById('nova-industria-nome');
  const nome = el.value.trim();
  if(!nome) return;
  let id = slugify(nome);
  if(state.fornecedores[id]){
    let n = 2;
    while(state.fornecedores[id+'-'+n]) n++;
    id = id+'-'+n;
  }
  await sb.from('fc_fornecedores').insert({ id, nome });
  await logHist('fornecedor', `Indústria "${nome}" cadastrada`, id);
  el.value = '';
  await refreshAndRender();
}
async function delFornecedor(fid){
  const f = state.fornecedores[fid];
  if(!f) return;
  const nPastas = f.pastas.length, nMsgs = f.mensagens.length;
  const nOrcs = state.orcamentos.filter(o=>o.fornecedorId===fid).length;
  const aviso = (nPastas||nMsgs||nOrcs)
    ? `Isso vai apagar "${f.nome}" e junto: ${nPastas} pasta(s), ${nMsgs} mensagem(ns) e ${nOrcs} orçamento(s) vinculados. Não pode ser desfeito. Continuar?`
    : `Excluir a indústria "${f.nome}"?`;
  if(!confirm(aviso)) return;
  await sb.from('fc_pastas').delete().eq('fornecedor_id', fid);
  await sb.from('fc_mensagens').delete().eq('fornecedor_id', fid);
  await sb.from('fc_orcamentos').delete().eq('fornecedor_id', fid);
  await sb.from('fc_fornecedores').delete().eq('id', fid);
  await logHist('fornecedor', `Indústria "${f.nome}" excluída`);
  await refreshAndRender();
}
function setPastaTipo(fid, tipo){ pastaTipo[fid] = tipo; render(); }

async function addPasta(fid){
  const nomeEl = document.getElementById('pasta-nome-'+fid);
  const nome = nomeEl.value.trim();
  if(!nome){ alert('Digite um nome para o anexo antes de adicionar.'); return; }
  const tipo = pastaTipo[fid] === 'foto' ? 'foto' : 'link';
  const btn = document.getElementById('pasta-btn-'+fid);

  if(tipo === 'foto'){
    const fileEl = document.getElementById('pasta-foto-'+fid);
    const file = fileEl.files[0];
    if(!file){ alert('Escolha um arquivo (foto, vídeo ou PDF) antes de adicionar.'); return; }
    btn.disabled = true; btn.textContent = 'Enviando...';
    try{
      const ext = file.name.split('.').pop();
      const path = `${fid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const { error: upErr } = await sb.storage.from('fc-anexos').upload(path, file);
      if(upErr) throw upErr;
      const { data:pub } = sb.storage.from('fc-anexos').getPublicUrl(path);
      await sb.from('fc_pastas').insert({ fornecedor_id: fid, nome, link: pub.publicUrl, tipo: 'foto' });
      await logHist('pasta', `Arquivo "${nome}" adicionado`, fid);
    }catch(e){
      alert('Erro ao enviar o arquivo: ' + (e.message||e));
      btn.disabled = false; btn.textContent = 'Adicionar';
      return;
    }
  } else {
    const linkEl = document.getElementById('pasta-link-'+fid);
    const link = linkEl.value.trim();
    if(!link){ alert('Cole um link antes de adicionar.'); return; }
    await sb.from('fc_pastas').insert({ fornecedor_id: fid, nome, link, tipo: 'link' });
    await logHist('pasta', `Pasta "${nome}" adicionada`, fid);
  }
  nomeEl.value='';
  await refreshAndRender();
}

// ---------- Envio ----------
function pickFornecedorEnvio(fid){ sendState.fornecedorId = fid; sendState.tipos=[]; sendState.itensPorTipo={pasta:null,mensagem:null,orcamento:null}; sendState.contatoIds=[]; sendState.canais=[]; sendState.enviados={}; render(); }
function toggleTipoEnvio(tipo){
  const idx = sendState.tipos.indexOf(tipo);
  if(idx>=0){ sendState.tipos.splice(idx,1); sendState.itensPorTipo[tipo]=null; }
  else { sendState.tipos.push(tipo); }
  sendState.contatoIds=[]; sendState.canais=[]; sendState.enviados={};
  render();
}
function pickItemEnvio(tipo, id){ sendState.itensPorTipo[tipo] = id; sendState.contatoIds=[]; sendState.canais=[]; sendState.enviados={}; render(); }
function toggleContatoEnvio(id){
  const idx = sendState.contatoIds.indexOf(id);
  if(idx>=0){
    sendState.contatoIds.splice(idx,1);
  } else {
    if(sendState.contatoIds.length >= 10){
      alert('Você pode selecionar até 10 contatos por vez.');
      return;
    }
    sendState.contatoIds.push(id);
  }
  render();
}
function toggleCanalEnvio(canal){
  const idx = sendState.canais.indexOf(canal);
  if(idx>=0){ sendState.canais.splice(idx,1); }
  else { sendState.canais.push(canal); }
  sendState.enviados = {};
  render();
}
async function marcarEnviado(contatoId, canal){
  const f = state.fornecedores[sendState.fornecedorId];
  const contato = state.contatos.find(c=>c.id===contatoId);
  if(f && contato) await logHist('envio', `Conteúdo de ${f.nome} enviado para ${contato.nome} via ${canal === 'whatsapp' ? 'WhatsApp' : 'e-mail'}`, sendState.fornecedorId);
  sendState.enviados[contatoId+'_'+canal] = true;
  render();
}

function buildMensagemEnvio(){
  const f = state.fornecedores[sendState.fornecedorId];
  const fNome = f ? f.nome : '';
  const partes = [];
  if(sendState.tipos.includes('pasta') && sendState.itensPorTipo.pasta){
    const p = f.pastas.find(p=>p.id===sendState.itensPorTipo.pasta);
    if(p){
      if(p.tipo === 'foto'){
        if(sendState.modoFoto === 'anexo' && !isPdf(p.link) && !isVideo(p.link)){
          partes.push(`Segue ${fNome} — ${p.nome}`);
        } else {
          const rotulo = isPdf(p.link) ? '📄 Toque no link para abrir o PDF' : isVideo(p.link) ? '🎥 Toque no link para assistir ao vídeo' : '📷 Toque no link para ver a imagem';
          partes.push(`Segue ${fNome} — ${p.nome}:\n${p.link}\n${rotulo}`);
        }
      } else {
        partes.push(`Segue material de ${fNome} — ${p.nome}:\n${p.link}`);
      }
    }
  }
  if(sendState.tipos.includes('mensagem') && sendState.itensPorTipo.mensagem){
    const m = f.mensagens.find(m=>m.id===sendState.itensPorTipo.mensagem);
    if(m) partes.push(m.texto);
  }
  if(sendState.tipos.includes('orcamento') && sendState.itensPorTipo.orcamento){
    const o = state.orcamentos.find(o=>o.id===sendState.itensPorTipo.orcamento);
    if(o) partes.push(`Segue orçamento de ${fNome} — ${o.titulo}:\n${o.link}`);
  }
  return partes.join('\n\n');
}

function renderFilaEnvio(){
  const corpo = buildMensagemEnvio();
  const f = state.fornecedores[sendState.fornecedorId];
  if(!corpo || !sendState.canais.length || !sendState.contatoIds.length) return '';

  const canalLabel = {whatsapp:'WhatsApp', email:'E-mail'};
  const linhas = sendState.contatoIds.map(cid=>{
    const contato = state.contatos.find(c=>c.id===cid);
    if(!contato) return '';
    const botoes = sendState.canais.map(canal=>{
      const enviado = !!sendState.enviados[cid+'_'+canal];
      let url = '';
      if(canal === 'whatsapp'){
        const numero = (contato.whatsapp||'').replace(/\D/g,'');
        url = `https://wa.me/${numero}?text=${encodeURIComponent(corpo)}`;
      } else {
        const assunto = `${f.nome} — material para ${contato.nome}`;
        url = `mailto:${encodeURIComponent(contato.email||'')}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
      }
      return `<a href="${url}" target="_blank" onclick="marcarEnviado('${cid}','${canal}')"><button class="btn small" style="margin-left:6px;">${enviado?'✅ '+canalLabel[canal]:canalLabel[canal]+' →'}</button></a>`;
    }).join('');
    return `
      <div class="list-item">
        <span>${esc(contato.nome)}${contato.empresa?' · '+esc(contato.empresa):''}</span>
        <span>${botoes}</span>
      </div>`;
  }).join('');

  const totalPares = sendState.contatoIds.length * sendState.canais.length;
  const totalEnviados = sendState.contatoIds.reduce((s,cid)=> s + sendState.canais.filter(c=>sendState.enviados[cid+'_'+c]).length, 0);

  let out = `
    <div class="hint" style="margin:10px 0;color:var(--text-dim);font-size:12px;">Clique no botão de cada contato, um de cada vez — cada clique abre a mensagem já pronta e individual para aquela pessoa, naquele canal. (${totalEnviados}/${totalPares} enviados)</div>
    ${linhas}`;

  if(state.meuWhatsapp && totalEnviados > 0){
    const resumo = `📋 Resumo de envio\n\nFornecedor: ${f.nome}\nCanal(is): ${sendState.canais.map(c=>canalLabel[c]).join(', ')}\nData: ${new Date().toLocaleString('pt-BR')}\nEnviado para ${sendState.contatoIds.filter(cid=>sendState.canais.some(c=>sendState.enviados[cid+'_'+c])).length} contato(s)\n\nConteúdo enviado:\n${corpo}`;
    const meuNum = state.meuWhatsapp.replace(/\D/g,'');
    const urlResumo = `https://wa.me/${meuNum}?text=${encodeURIComponent(resumo)}`;
    out += `<div class="send-actions">
      <a href="${urlResumo}" target="_blank"><button class="btn ghost">📋 Enviar resumo para meu WhatsApp →</button></a>
    </div>`;
  }
  return out;
}

    ${loadError ? `<div class="err-banner">Não foi possível conectar ao banco de dados agora (${esc(loadError)}). Verifique sua internet e recarregue a página.</div>` : ''}
    <nav class="tabs">
      <button class="${activeTab==='fornecedores'?'active':''}" onclick="setTab('fornecedores')">Fornecedores</button>

      <button class="${activeTab==='relatorios'?'active':''}" onclick="setTab('relatorios')">Relatórios</button>
    </nav>
    <div id="tab-content"></div>
  `;
  const content = document.getElementById('tab-content');
  if(activeTab==='fornecedores') content.innerHTML = renderFornecedores();

        <input class="flex" id="orc-titulo" placeholder="Título / cliente (ex: Orçamento - Metalúrgica ABC)">
      </div>
      <div class="inline-form">
        <input class="flex" id="orc-numero" placeholder="Número do orçamento (ex: 1024)">
        <input class="flex" id="orc-valor" type="number" step="0.01" placeholder="Valor (R$)">
        <input class="flex" id="orc-link" placeholder="Link do orçamento (PDF, Drive...)">
        <button class="btn" onclick="addOrcamento()">Adicionar</button>
      </div>
    </div>
    ${rows || '<div class="empty">Nenhum orçamento cadastrado ainda.</div>'}
  `;
}

function renderContatos(){
  const rows = state.contatos.slice().reverse().map(c=>`
    <div class="card contato-card">
      <div class="contato-info">
        <div class="nome">${esc(c.nome)}</div>
        ${c.empresa?`<div class="empresa">${esc(c.empresa)}</div>`:''}
        <div class="details">${c.whatsapp?`📱 ${esc(c.whatsapp)}`:''} ${c.email?` · ✉ ${esc(c.email)}`:''}</div>
      </div>
      <button class="del" onclick="delContato('${c.id}')" style="font-size:18px;">✕</button>
    </div>`).join('');

  return `
    <details class="import-box">
      <summary>Importar vários contatos de uma vez</summary>
      <div class="hint">
        Cole uma lista, um contato por linha, no formato:<br>
        <span class="mono">Nome, Empresa, WhatsApp, E-mail</span><br>
        Exemplo: <span class="mono">João Silva, Marcenaria Silva, 5511999998888, joao@marcenaria.com</span><br>
        Empresa, WhatsApp e e-mail são opcionais — mantenha as vírgulas na ordem certa.
      </div>
      <textarea id="import-textarea" placeholder="Cole aqui a lista de contatos..." style="min-height:100px;"></textarea>
      <button class="btn" style="margin-top:8px;" onclick="importContatos()">Importar lista</button>
    </details>
    <div class="card">
      <h4 style="margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);">Novo contato</h4>
      <div class="grid2">
        <input id="c-nome" placeholder="Nome do cliente">
        <input id="c-empresa" placeholder="Empresa">
        <input id="c-whatsapp" placeholder="WhatsApp (com DDD, ex: 5511999999999)">
        <input id="c-email" placeholder="E-mail">
      </div>
      <button class="btn" style="margin-top:10px;" onclick="addContato()">Salvar contato</button>
    </div>
    ${rows || '<div class="empty">Nenhum contato salvo ainda.</div>'}
  `;
}

function renderEnviar(){
  let html = '';
  html += `
    <div class="card">
      <h4 style="margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);">Seu WhatsApp (para receber os resumos de envio)</h4>
      <div class="inline-form">
        <input class="flex" id="meu-whatsapp-input" placeholder="Ex: 5511999999999 (com DDD e país)" value="${esc(state.meuWhatsapp||'')}">
        <button class="btn" onclick="salvarMeuWhatsapp()">Salvar</button>
      </div>
    </div>`;
  html += `<div class="steps">`;
  html += `
    <div class="step">
      <div><span class="num">1</span><h4>Escolha o fornecedor</h4></div>
      <div class="step-body item-pick">
        ${getFornecedoresList().map(f=>`<div class="chip ${sendState.fornecedorId===f.id?'sel':''}" onclick="pickFornecedorEnvio('${f.id}')">${esc(f.nome)}</div>`).join('')}
      </div>
    </div>`;

  if(sendState.fornecedorId){
    const f = state.fornecedores[sendState.fornecedorId];
    html += `
    <div class="step">
      <div><span class="num">2</span><h4>Escolha o conteúdo (pode marcar mais de um)</h4></div>
      <div class="step-body item-pick">
        <div class="chip ${sendState.tipos.includes('pasta')?'sel':''}" onclick="toggleTipoEnvio('pasta')">${sendState.tipos.includes('pasta')?'✓ ':''}Pasta / anexo</div>
        <div class="chip ${sendState.tipos.includes('mensagem')?'sel':''}" onclick="toggleTipoEnvio('mensagem')">${sendState.tipos.includes('mensagem')?'✓ ':''}Mensagem de texto</div>
        <div class="chip ${sendState.tipos.includes('orcamento')?'sel':''}" onclick="toggleTipoEnvio('orcamento')">${sendState.tipos.includes('orcamento')?'✓ ':''}Orçamento</div>
      </div>
      ${sendState.tipos.includes('pasta') ? `<div class="step-body item-pick" style="margin-top:12px;">
        ${f.pastas.length ? f.pastas.map(p=>`<div class="chip ${sendState.itensPorTipo.pasta===p.id?'sel':''}" onclick="pickItemEnvio('pasta','${p.id}')">${esc(p.nome)}</div>`).join('') : '<div class="empty">Nenhuma pasta cadastrada para este fornecedor.</div>'}
      </div>` : ''}
      ${sendState.tipos.includes('mensagem') ? `<div class="step-body item-pick" style="margin-top:12px;">
        ${f.mensagens.length ? f.mensagens.map(m=>`<div class="chip ${sendState.itensPorTipo.mensagem===m.id?'sel':''}" onclick="pickItemEnvio('mensagem','${m.id}')">${esc(m.texto.slice(0,40))}${m.texto.length>40?'…':''}</div>`).join('') : '<div class="empty">Nenhuma mensagem cadastrada para este fornecedor.</div>'}
      </div>` : ''}
      ${sendState.tipos.includes('orcamento') ? `<div class="step-body item-pick" style="margin-top:12px;">
        ${(()=>{
            const orcs = state.orcamentos.filter(o=>o.fornecedorId===sendState.fornecedorId);
            return orcs.length ? orcs.map(o=>`<div class="chip ${sendState.itensPorTipo.orcamento===o.id?'sel':''}" onclick="pickItemEnvio('orcamento','${o.id}')">${esc(o.titulo)}</div>`).join('') : '<div class="empty">Nenhum orçamento cadastrado para este fornecedor.</div>';
          })()}
      </div>` : ''}
    </div>`;
  }

  const mensagemPronta = sendState.fornecedorId ? buildMensagemEnvio() : '';
  if(mensagemPronta){
    const f2 = state.fornecedores[sendState.fornecedorId];
    const pastaSelecionada = sendState.tipos.includes('pasta') && sendState.itensPorTipo.pasta
      ? f2.pastas.find(p=>p.id===sendState.itensPorTipo.pasta) : null;
    const temArquivoEnviado = pastaSelecionada && pastaSelecionada.tipo === 'foto';
    const ehImagemDeVerdade = temArquivoEnviado && !isPdf(pastaSelecionada.link) && !isVideo(pastaSelecionada.link);

    html += `
    <div class="step">
      ${ehImagemDeVerdade ? `
        <h4 style="margin:0 0 8px;">Como quer mandar a foto?</h4>
        <div class="step-body item-pick" style="margin-bottom:12px;">
          <div class="chip ${sendState.modoFoto!=='anexo'?'sel':''}" onclick="setModoFoto('link')">${sendState.modoFoto!=='anexo'?'✓ ':''}Link (0 cliques extras)</div>
          <div class="chip ${sendState.modoFoto==='anexo'?'sel':''}" onclick="setModoFoto('anexo')">${sendState.modoFoto==='anexo'?'✓ ':''}Foto anexada de verdade</div>
        </div>` : ''}
      <h4 style="margin:0 0 10px;">Pré-visualização da mensagem</h4>
      <div class="preview">${esc(mensagemPronta)}</div>
      ${temArquivoEnviado ? `
        <div class="hint" style="margin-top:10px;color:var(--text-dim);font-size:12px;">
          ${ehImagemDeVerdade && sendState.modoFoto==='anexo'
            ? 'O WhatsApp não deixa anexar foto automaticamente por link — por isso a mensagem já sai sem o link. Baixe a foto abaixo e anexe ela na conversa antes de mandar:'
            : 'A mensagem já vai com o link para o cliente abrir. Se preferir mandar o arquivo anexado de verdade (em vez de só o link), baixe aqui e anexe manualmente na conversa antes de enviar:'}
        </div>
        <div class="send-actions" style="margin-top:8px;">
          <a href="${esc(pastaSelecionada.link)}" target="_blank" download="${esc(pastaSelecionada.nome)}"><button class="btn ghost">⬇ Baixar arquivo${ehImagemDeVerdade && sendState.modoFoto==='anexo' ? '' : ' (opcional)'}</button></a>
        </div>` : ''}
    </div>`;
  }

  if(mensagemPronta){
    html += `
    <div class="step">
      <div><span class="num">3</span><h4>Escolha os clientes (até 10)</h4></div>
      <div class="step-body item-pick">
        ${state.contatos.length ? state.contatos.map(c=>`<div class="chip ${sendState.contatoIds.includes(c.id)?'sel':''}" onclick="toggleContatoEnvio('${c.id}')">${sendState.contatoIds.includes(c.id)?'✓ ':''}${esc(c.nome)}${c.empresa?' · '+esc(c.empresa):''}</div>`).join('') : '<div class="empty">Cadastre um contato na aba Contatos primeiro.</div>'}
      </div>
      ${sendState.contatoIds.length ? `<div class="hint" style="margin-top:8px;color:var(--text-dim);font-size:12px;">${sendState.contatoIds.length} de 10 selecionado(s)</div>` : ''}
    </div>`;
  }

  if(sendState.contatoIds.length){
    html += `
    <div class="step">
      <div><span class="num">4</span><h4>Forma de envio (pode marcar os dois)</h4></div>
      <div class="step-body item-pick">
        <div class="chip ${sendState.canais.includes('whatsapp')?'sel':''}" onclick="toggleCanalEnvio('whatsapp')">${sendState.canais.includes('whatsapp')?'✓ ':''}WhatsApp</div>
        <div class="chip ${sendState.canais.includes('email')?'sel':''}" onclick="toggleCanalEnvio('email')">${sendState.canais.includes('email')?'✓ ':''}E-mail</div>
      </div>
      ${sendState.canais.length ? renderFilaEnvio() : ''}
    </div>`;
  }

  html += `</div>`;
  return html;
}

// ---------- Relatórios: Histórico + Desempenho ----------
function setHistFiltro(campo, valor){ histFiltro[campo] = valor; render(); }
function limparHistFiltro(){ histFiltro = {inicio:'', fim:''}; render(); }

function getHistoricoFiltrado(){
  let items = (state.historico||[]).slice();
  if(histFiltro.inicio){
    items = items.filter(h => new Date(h.data) >= new Date(histFiltro.inicio+'T00:00:00'));
  }
  if(histFiltro.fim){
    items = items.filter(h => new Date(h.data) <= new Date(histFiltro.fim+'T23:59:59'));
  }
  return items;
}

function renderRelatorios(){
  return `
    <div class="subtabs">
      <button class="${relatorioSub==='historico'?'active':''}" onclick="setRelatorioSub('historico')">Histórico</button>
      <button class="${relatorioSub==='desempenho'?'active':''}" onclick="setRelatorioSub('desempenho')">Desempenho</button>
    </div>
    ${relatorioSub==='historico' ? renderHistorico() : renderDesempenho()}
  `;
}

function renderHistorico(){
  const items = getHistoricoFiltrado();
  const tagLabel = {pasta:'pasta', mensagem:'mensagem', orcamento:'orçamento', status:'status', contato:'contato', envio:'envio', fornecedor:'indústria'};
  return `
    <div class="card">
      <div class="inline-form" style="align-items:center;">
        <label class="mono" style="font-size:11px;color:var(--text-dim);">DE <input type="date" value="${histFiltro.inicio}" onchange="setHistFiltro('inicio', this.value)"></label>
        <label class="mono" style="font-size:11px;color:var(--text-dim);">ATÉ <input type="date" value="${histFiltro.fim}" onchange="setHistFiltro('fim', this.value)"></label>
        <button class="btn ghost small" onclick="limparHistFiltro()">Limpar</button>
        <button class="btn small" onclick="window.print()">🖨 Imprimir</button>
        ${state.meuWhatsapp ? `<button class="btn small" style="margin-left:auto;" onclick="enviarResumoWhatsapp()">📋 Resumo por fornecedor → meu WhatsApp</button>` : ''}
      </div>
    </div>
    <div class="card">
      ${items.length ? items.map(h=>`
        <div class="hist-item">
          <div class="hdate">${fmtDateTime(h.data)}</div>
          <div class="htag">${tagLabel[h.tipo]||h.tipo}</div>
          <div>${esc(h.descricao)}${h.fornecedorId && state.fornecedores[h.fornecedorId] ? ` <span style="color:var(--text-dim);">— ${esc(state.fornecedores[h.fornecedorId].nome)}</span>` : ''}</div>
        </div>`).join('') : '<div class="empty">Nenhum evento registrado neste período.</div>'}
    </div>
  `;
}

function enviarResumoWhatsapp(){
  const items = getHistoricoFiltrado().filter(h=>h.tipo==='envio');
  const listaFornecedores = getFornecedoresList();
  const porFornecedor = {};
  listaFornecedores.forEach(f=>{ porFornecedor[f.id] = 0; });
  items.forEach(h=>{ if(h.fornecedorId && porFornecedor[h.fornecedorId] !== undefined) porFornecedor[h.fornecedorId]++; });

  const periodo = histFiltro.inicio || histFiltro.fim
    ? `${histFiltro.inicio ? new Date(histFiltro.inicio+'T00:00:00').toLocaleDateString('pt-BR') : 'início'} até ${histFiltro.fim ? new Date(histFiltro.fim+'T00:00:00').toLocaleDateString('pt-BR') : 'hoje'}`
    : 'todo o período';

  let texto = `📊 Resumo de envios por fornecedor\nPeríodo: ${periodo}\n\n`;
  listaFornecedores.forEach(f=>{
    texto += `${f.nome}: ${porFornecedor[f.id]} envio(s)\n`;
  });
  texto += `\nTotal: ${items.length} envio(s)`;

  const meuNum = state.meuWhatsapp.replace(/\D/g,'');
  const url = `https://wa.me/${meuNum}?text=${encodeURIComponent(texto)}`;
  window.open(url, '_blank');
}

function calcDesempenho(){
  return getFornecedoresList().map(f=>{
    const orcs = state.orcamentos.filter(o=>o.fornecedorId===f.id);
    const confirmados = orcs.filter(o=>o.status==='confirmado');
    const aguardando = orcs.filter(o=>o.status==='aguardando');
    const naoFechados = orcs.filter(o=>o.status==='nao_fechado');
    const valorFechado = confirmados.reduce((s,o)=>s+(parseFloat(o.valor)||0),0);
    const taxa = orcs.length ? Math.round((confirmados.length/orcs.length)*100) : 0;
    return { fornecedor:f, total:orcs.length, confirmados, aguardando, naoFechados, valorFechado, taxa };
  });
}

function renderDesempenho(){
  const dados = calcDesempenho();
  const totalGeral = dados.reduce((s,d)=>s+d.total,0);
  const totalFechado = dados.reduce((s,d)=>s+d.confirmados.length,0);
  const valorGeral = dados.reduce((s,d)=>s+d.valorFechado,0);

  const kpis = `
    <div class="kpi-row">
      <div class="kpi"><div class="val">${totalGeral}</div><div class="lbl">Orçamentos totais</div></div>
      <div class="kpi"><div class="val">${totalFechado}</div><div class="lbl">Fechados</div></div>
      <div class="kpi"><div class="val">${totalGeral? Math.round((totalFechado/totalGeral)*100):0}%</div><div class="lbl">Taxa de fechamento</div></div>
      <div class="kpi"><div class="val" style="font-size:18px;">${fmtMoney(valorGeral)}</div><div class="lbl">Valor fechado</div></div>
    </div>
  `;

  const chartsHtml = dados.map(d=>`
    <div class="chart-wrap">
      <h4>${esc(d.fornecedor.nome)} <span class="mono" style="font-size:11px;color:var(--text-dim);font-weight:400;">— ${d.total} orçamento(s) · ${d.taxa}% fechamento · ${fmtMoney(d.valorFechado)} fechado</span></h4>
      <canvas id="chart-${d.fornecedor.id}" height="90"></canvas>
      ${d.confirmados.length ? `
        <div class="fechados-list">
          <h4 style="margin-top:14px;">Orçamentos fechados</h4>
          ${d.confirmados.map(o=>`<div class="li"><span>${o.numero?`nº ${esc(o.numero)} — `:''}${esc(o.titulo)}</span><span class="mono">${fmtMoney(o.valor)}</span></div>`).join('')}
        </div>` : ''}
    </div>
  `).join('');

  return kpis + `<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button class="btn small" onclick="window.print()">🖨 Imprimir relatório</button></div>` + chartsHtml;
}

function drawCharts(){
  const dados = calcDesempenho();
  dados.forEach(d=>{
    const canvas = document.getElementById('chart-'+d.fornecedor.id);
    if(!canvas || typeof Chart === 'undefined') return;
    if(chartInstances[d.fornecedor.id]) chartInstances[d.fornecedor.id].destroy();
    chartInstances[d.fornecedor.id] = new Chart(canvas, {
      type:'bar',
      data:{
        labels:['Confirmado','Aguardando','Não fechado'],
        datasets:[{
          data:[d.confirmados.length, d.aguardando.length, d.naoFechados.length],
          backgroundColor:['#5aa476','#c9973f','#c06452'],
          borderRadius:6,
          barThickness:36
        }]
      },
      options:{
        responsive:true,
        plugins:{ legend:{display:false} },
        scales:{
          y:{ beginAtZero:true, ticks:{ color:'#8b929b', precision:0 }, grid:{ color:'#2c333c' } },
          x:{ ticks:{ color:'#e9e6e0' }, grid:{ display:false } }
        }
      }
    });
  });
}

async function init(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  authChecked = true;
  if(session && !recoveryMode){
    await refreshAndRender();
  } else {
    render();
  }
  sb.auth.onAuthStateChange((event, newSession)=>{
    if(event === 'PASSWORD_RECOVERY'){
      recoveryMode = true;
      session = newSession;
      render();
      return;
    }
    session = newSession;
    if(!newSession){ render(); }
  });
}
init();
</script>
